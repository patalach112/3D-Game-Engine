name: Windows MinGW build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-glslang
      - name: Configure Release (warnings are errors)
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS=-Werror
      - name: Build editor and tests
        run: cmake --build build --parallel 2
      # This checks compilation/linking, not presentation: hosted Windows
      # runners are not guaranteed to have a Vulkan-capable GPU/ICD.
