name: Windows MinGW build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-glslang
            nasm
      - name: Configure Release (warnings are errors)
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS=-Werror
      - name: Build editor and tests
        run: cmake --build build --parallel 2
      - name: Test platform, geometry and editor state (no GPU required)
        run: |
          ctest --test-dir build -R '^(platform_tests|geometry_tests|editor_state_tests|input_tests|render_worker_tests|camera_smoothing_tests|log_tests|docking_tests)$' --output-on-failure --no-tests=error
          ./build/platform_tests.exe --window
      - name: Check EXE and engine DLL imports (no GPU required)
        run: ctest --test-dir build -R '^engine_runtime_dependencies$' --output-on-failure --no-tests=error
      - name: Package redistributable ZIP
        run: cmake --build build --target package
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-portable-editor
          path: build/Starter3DEngine-*.zip
      # This checks compilation/linking, not presentation: hosted Windows
      # runners are not guaranteed to have a Vulkan-capable GPU/ICD.
