name: Windows MSVC build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Packaged Vulkan C headers/loader and shader tools only. Every engine,
      # editor and test C++ source below is compiled by MSVC, not MinGW.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-glslang
            nasm
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare MSVC import library for the Vulkan C ABI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps/include | Out-Null
          # Do not put the whole MinGW include tree on MSVC's search path.
          Copy-Item -Recurse "${{ steps.msys2.outputs.msys2-location }}/mingw64/include/vulkan" deps/include/
          Copy-Item -Recurse "${{ steps.msys2.outputs.msys2-location }}/mingw64/include/vk_video" deps/include/
          git clone --depth 1 --branch v1.3.290 https://github.com/KhronosGroup/Vulkan-Loader deps/vulkan-loader
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lib.exe /nologo /machine:x64 /def:deps/vulkan-loader/loader/vulkan-1.def /out:deps/vulkan-1.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '${{ steps.msys2.outputs.msys2-location }}/mingw64/bin' >> $env:GITHUB_PATH
      - name: Configure Visual Studio x64
        shell: pwsh
        run: |
          cmake -S . -B build-msvc -A x64 -DBUILD_TESTING=ON -DENGINE_USE_ASM=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON "-DCMAKE_ASM_NASM_COMPILER=${{ steps.msys2.outputs.msys2-location }}/usr/bin/nasm.exe" -DVulkan_INCLUDE_DIR=${{ github.workspace }}/deps/include -DVulkan_LIBRARY=${{ github.workspace }}/deps/vulkan-1.lib 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            $details = ((Get-Content configure.log | Select-Object -Last 100) -join '%0A')
            Write-Output "::error::$details"
            exit $code
          }
      - name: Build Release and Debug (C++ flags must not reach NASM)
        run: |
          foreach ($config in 'Release', 'Debug') {
            cmake --build build-msvc --config $config --parallel 2 2>&1 | Tee-Object -FilePath "msvc-$config.log"
            if ($LASTEXITCODE -ne 0) {
              $code = $LASTEXITCODE
              Get-Content "msvc-$config.log" | Select-String 'error|warning C' | Select-Object -First 25 | ForEach-Object {
                Write-Output "::error::$($_.Line)"
              }
              exit $code
            }
          }
      - name: Test without a Vulkan GPU
        shell: pwsh
        run: |
          foreach ($config in 'Release', 'Debug') {
            ctest --test-dir build-msvc -C $config -R '^(platform_tests|geometry_tests|geometry_cache_tests|bindings_tests|hud_tests|editor_startup_tests|editor_state_tests|input_tests|render_worker_tests|camera_smoothing_tests|log_tests|docking_tests)$' --output-on-failure --no-tests=error 2>&1 | Tee-Object -FilePath "tests-$config.log"
            if ($LASTEXITCODE -ne 0) {
              $code = $LASTEXITCODE
              $details = ((Get-Content "tests-$config.log" | Select-Object -Last 100) -join '%0A')
              Write-Output "::error::$details"
              exit $code
            }
          }
      - name: Install software Vulkan ICD for real Windows startup tests
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.5/mesa3d-26.2.5-release-msvc.7z' -OutFile mesa.7z
          & 7z x mesa.7z '-odeps/mesa' -y | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $icd = Get-ChildItem deps/mesa -Recurse -Filter '*lvp*.json' | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (!$icd) { throw 'Lavapipe x64 ICD not found' }
          "VK_ICD_FILENAMES=$($icd.FullName)" >> $env:GITHUB_ENV
          $icd.DirectoryName >> $env:GITHUB_PATH
      - name: Launch both real GUI executables and present Vulkan frames
        shell: pwsh
        run: |
          foreach ($config in 'Release', 'Debug') {
            & ./cmake/windows_editor_smoke.ps1 -BinaryDirectory "build-msvc/$config"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-startup-diagnostics
          path: build-msvc/*/startup-smoke-logs/**/*.log
      - name: Package Release
        run: cmake --build build-msvc --config Release --target package
